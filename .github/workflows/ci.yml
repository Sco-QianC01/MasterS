name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pure stdlib — no dependency install needed.
      # Regression-checks all 60 prototypes + tool smoke tests; exits 1 on any issue.
      - run: python3 tools/self_test.py
